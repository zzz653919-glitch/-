<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Til Yo'li — ingliz tilini o'rganing</title>
<meta name="description" content="Ingliz tilini A1 dan IELTS gacha o'rganish: darslar, mashqlar, XP, seriya va yutuqlar.">
<meta name="theme-color" content="#16a34a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2322c55e'/%3E%3Cpath d='M18 22h28M32 22v24' stroke='white' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f8f2;--card:#fff;--ink:#1f2a37;--mute:#6b7788;--line:#e3e9e0;
  --green:#22c55e;--green-d:#15803d;--green-l:#dcfce7;
  --blue:#3b82f6;--blue-d:#1d4ed8;--blue-l:#dbeafe;
  --yellow:#facc15;--yellow-d:#ca8a04;--yellow-l:#fef9c3;
  --red:#ef4444;--red-d:#b91c1c;--red-l:#fee2e2;
  --purple:#8b5cf6;--lock:#d5dbd2;--shadow:0 2px 0 rgba(0,0,0,.06);
  --r:20px;--font:"Nunito","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme=dark]{
  --bg:#0f1713;--card:#18231d;--ink:#eaf2ec;--mute:#93a69a;--line:#2a3a31;
  --green-l:#12351f;--blue-l:#14284a;--yellow-l:#3a3208;--red-l:#3d1717;--lock:#34443a;--shadow:0 2px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 var(--font)}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;font-weight:800}
h1{font-size:1.9rem}h2{font-size:1.35rem}h3{font-size:1.1rem}
p{margin:0 0 .8em}
a{color:var(--blue-d)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:#000;color:#fff;padding:.6rem 1rem;z-index:99}
.skip:focus{left:8px;top:8px}
[hidden]{display:none!important}
.mute{color:var(--mute)}.center{text-align:center}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Tugmalar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.65rem 1.4rem;border:0;border-radius:16px;
  background:var(--green);color:#fff;font-weight:800;letter-spacing:.02em;text-transform:uppercase;font-size:.95rem;cursor:pointer;
  box-shadow:0 4px 0 var(--green-d);transition:transform .08s,box-shadow .08s,filter .15s;text-decoration:none}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn[disabled]{background:var(--lock);box-shadow:0 4px 0 #b6beb3;color:var(--mute);cursor:not-allowed;transform:none}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.yellow{background:var(--yellow);color:#4a3b00;box-shadow:0 4px 0 var(--yellow-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--card);color:var(--blue-d);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
:root[data-theme=dark] .btn.ghost{color:#9cc2ff}
.btn.block{width:100%}.btn.small{min-height:38px;padding:.35rem .9rem;font-size:.8rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:1.1rem 1.25rem;box-shadow:var(--shadow);margin-bottom:1rem}
.grid{display:grid;gap:1rem}.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

/* Maket */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:1.2rem .9rem;border-right:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:.3rem}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:900;font-size:1.4rem;color:var(--green-d);padding:0 .5rem 1rem;text-decoration:none}
:root[data-theme=dark] .brand{color:var(--green)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--green);display:grid;place-items:center;box-shadow:0 3px 0 var(--green-d)}
.logo svg{width:24px;height:24px}
.nav a{display:flex;align-items:center;gap:.8rem;padding:.65rem .8rem;border-radius:14px;border:2px solid transparent;color:var(--mute);font-weight:800;text-decoration:none;text-transform:uppercase;font-size:.85rem;letter-spacing:.04em}
.nav a:hover{background:var(--bg)}
.nav a[aria-current=page]{background:var(--blue-l);border-color:var(--blue);color:var(--blue-d)}
:root[data-theme=dark] .nav a[aria-current=page]{color:#9cc2ff}
.nav .ic{font-size:1.4rem;width:1.8rem;text-align:center}
.main{min-width:0}
.top{position:sticky;top:0;z-index:10;display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap;padding:.7rem 1.2rem;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px)}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .8rem;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:800;text-decoration:none;color:var(--ink);min-height:40px}
.chip.fire{color:#ea580c}.chip.xp{color:var(--yellow-d)}.chip.heart{color:var(--red)}.chip.lvl{color:var(--blue-d)}
:root[data-theme=dark] .chip.lvl{color:#9cc2ff}
.page{max-width:760px;margin:0 auto;padding:.5rem 1.2rem 6rem}
.tabs{display:none}

/* Bar */
.bar{height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--green);transition:width .35s}
.bar.blue>i{background:var(--blue)}.bar.yellow>i{background:var(--yellow)}

/* Bosh sahifa */
.hero{background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;border:0;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero h2{margin:0 0 .2rem}.hero p{margin:0;opacity:.95}
.hero .btn{background:#fff;color:var(--green-d);box-shadow:0 4px 0 #bbf7d0}
.ring{width:96px;height:96px;flex:none}
.ring text{font-weight:800;fill:var(--ink)}
.stat{text-align:center}.stat b{display:block;font-size:1.6rem}
.quest{display:flex;gap:.8rem;align-items:center;padding:.7rem 0;border-top:2px solid var(--line)}
.quest:first-of-type{border-top:0}.quest .bar{margin-top:.3rem;height:12px}.quest>div{flex:1}

/* Xarita */
.lvl-head{border-radius:var(--r);padding:1rem 1.2rem;color:#fff;margin:1.5rem 0 1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.lvl-head h2{margin:0}.lvl-head small{opacity:.9;font-weight:700}
.path{display:flex;flex-direction:column;align-items:center;gap:1.1rem;padding:.5rem 0}
.node{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:.35rem;cursor:pointer;width:130px;padding:0}
.node .disc{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:2rem;color:#fff;background:var(--c);box-shadow:0 7px 0 var(--cd);transition:transform .1s,box-shadow .1s;position:relative}
.node:active .disc{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.node .lab{font-weight:800;font-size:.85rem;text-align:center}
.node.done .disc{--c:var(--yellow);--cd:var(--yellow-d)}
.node.cur .disc{--c:var(--green);--cd:var(--green-d);animation:pulse 1.8s ease-in-out infinite}
.node.lock .disc{--c:var(--lock);--cd:#b6beb3;filter:grayscale(1);opacity:.9}
.node.lock .lab{color:var(--mute)}
.node .badge{position:absolute;right:-6px;top:-6px;background:var(--card);color:var(--green-d);border:2px solid var(--line);border-radius:50%;width:28px;height:28px;font-size:.9rem;display:grid;place-items:center}
.node .start{position:absolute;top:-30px;background:var(--card);border:2px solid var(--line);color:var(--green-d);font-size:.7rem;font-weight:900;padding:.1rem .6rem;border-radius:10px;text-transform:uppercase}
@keyframes pulse{0%,100%{box-shadow:0 7px 0 var(--cd),0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 7px 0 var(--cd),0 0 0 14px rgba(34,197,94,0)}}

/* Modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,15,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:1.4rem 1.3rem calc(1.4rem + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease-out}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.words{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0 1rem}
.pill{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:.15rem .6rem;font-weight:700;font-size:.9rem}

/* Dars */
#lesson{position:fixed;inset:0;z-index:40;background:var(--card);display:flex;flex-direction:column}
.l-top{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;max-width:900px;width:100%;margin:0 auto}
.l-top .bar{flex:1}
.x{background:none;border:0;font-size:1.6rem;cursor:pointer;color:var(--mute);width:44px;height:44px;border-radius:12px}
.x:hover{background:var(--bg)}
.l-body{flex:1;overflow:auto;padding:1rem;max-width:700px;width:100%;margin:0 auto}
.q-hint{font-size:1.5rem;font-weight:800;margin-bottom:1rem}
.q-prompt{font-size:2rem;font-weight:900;margin:.5rem 0 1.2rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;overflow-wrap:anywhere}
.q-prompt.big{font-size:5rem}
.spk{border:2px solid var(--line);background:var(--blue-l);border-radius:14px;width:52px;height:52px;font-size:1.5rem;cursor:pointer}
.opts{display:grid;gap:.7rem}
@media(min-width:600px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:.8rem;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:.9rem 1rem;font-weight:700;font-size:1.1rem;cursor:pointer;min-height:56px}
.opt kbd{border:2px solid var(--line);border-radius:8px;padding:0 .45rem;font-size:.8rem;color:var(--mute)}
.opt:hover{background:var(--bg)}
.opt.sel{border-color:var(--blue);background:var(--blue-l)}
.opt.good{border-color:var(--green);background:var(--green-l)}
.opt.bad{border-color:var(--red);background:var(--red-l)}
.inp{width:100%;font-size:1.3rem;font-weight:700;padding:.9rem 1rem;border-radius:16px;border:2px solid var(--line);background:var(--bg)}
.inp:focus{border-color:var(--blue);outline:0}
.tray{min-height:62px;border-bottom:3px solid var(--line);display:flex;flex-wrap:wrap;gap:.5rem;padding:.4rem 0;margin-bottom:1rem}
.tile{border:2px solid var(--line);border-bottom-width:5px;background:var(--card);border-radius:12px;padding:.5rem .85rem;font-size:1.25rem;font-weight:800;cursor:pointer;min-width:46px;min-height:48px}
.tile:hover{background:var(--bg)}.tile[disabled]{opacity:.25;cursor:default}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.mcols .opt{justify-content:center;text-align:center;padding:.7rem .5rem}
.opt.gone{visibility:hidden}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-top:2px solid var(--line);padding:1rem;transition:background .2s}
.fb-in{max-width:700px;margin:0 auto;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fb.good{background:var(--green-l)}.fb.bad{background:var(--red-l)}
.fb .msg{flex:1;min-width:200px}.fb.good .msg b{color:var(--green-d)}.fb.bad .msg b{color:var(--red-d)}
:root[data-theme=dark] .fb.good .msg b{color:var(--green)}:root[data-theme=dark] .fb.bad .msg b{color:#fca5a5}
.msg small{display:block;color:var(--mute);margin-top:.2rem}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.big-emoji{font-size:4rem;text-align:center}
.wcard{display:flex;gap:.8rem;align-items:center;padding:.7rem 0;border-top:2px solid var(--line)}
.wcard:first-child{border-top:0}.wcard .e{font-size:2rem;width:2.5rem;text-align:center}.wcard div{flex:1}

/* Boshqa sahifalar */
.bars{display:flex;align-items:flex-end;gap:.5rem;height:150px;padding-top:.5rem}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.75rem;color:var(--mute)}
.bars i{display:block;width:100%;max-width:38px;background:var(--blue);border-radius:8px 8px 0 0;min-height:3px}
.bars i.today{background:var(--green)}
.ach{display:flex;gap:.9rem;align-items:center}.ach .ai{font-size:2.2rem;width:3.4rem;height:3.4rem;border-radius:16px;background:var(--yellow-l);display:grid;place-items:center;flex:none}
.ach.off{opacity:.55}.ach.off .ai{filter:grayscale(1);background:var(--line)}
.form label{display:block;font-weight:800;margin:.8rem 0 .3rem}
.seg{display:flex;gap:.5rem;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:.5rem 1rem;font-weight:800;cursor:pointer;min-height:44px}
.seg button[aria-pressed=true]{border-color:var(--blue);background:var(--blue-l)}
.row{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.err{color:var(--red-d);font-weight:700;min-height:1.5em}
:root[data-theme=dark] .err{color:#fca5a5}
.auth{max-width:440px;margin:0 auto;padding:2rem 1.2rem}
.auth .brand{justify-content:center}
.toast{background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s}
#toasts{position:fixed;left:0;right:0;bottom:84px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:.5rem;pointer-events:none;padding:0 1rem}
table.t{width:100%;border-collapse:collapse}.t td,.t th{padding:.45rem .3rem;border-top:2px solid var(--line);text-align:left}
.t th{color:var(--mute);font-size:.8rem;text-transform:uppercase}

@media(max-width:820px){
  .shell{display:block}
  .side{display:none}
  .page{padding:.3rem 1rem 7rem}
  .top{justify-content:space-between;padding:.5rem .8rem}
  .chip{padding:.2rem .6rem;min-height:36px}
  .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:2px solid var(--line);padding:.3rem .2rem calc(.3rem + env(safe-area-inset-bottom))}
  .tabs a,.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:none;text-decoration:none;color:var(--mute);font-size:.68rem;font-weight:800;padding:.25rem 0;min-height:48px;cursor:pointer}
  .tabs .ic{font-size:1.5rem;line-height:1.2}
  .tabs [aria-current=page]{color:var(--blue-d)}
  .q-prompt{font-size:1.6rem}.q-prompt.big{font-size:4rem}.q-hint{font-size:1.25rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
<script>try{var t=JSON.parse(localStorage.getItem('tilyoli:pref')||'{}').theme;var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}</script>

<body>

<div id="lesson" hidden></div>
<div id="modal" hidden></div>

<noscript><p style="padding:2rem">Bu sayt ishlashi uchun JavaScript kerak.</p></noscript>
<script>
/* Kurs ma'lumotlari. So'z qatori: inglizcha|tarjimalar(;)|emoji|inglizcha gap|o'zbekcha gap
   MUHIM: so'zlarning tartibini o'zgartirmang — progress so'z identifikatoriga (daraja.mavzu.indeks) bog'langan. Yangi so'zlarni oxiriga qo'shing. */
(function (TY) {
  var L = [];
  function lvl(id, title, sub, color, topics) { L.push({ id: id, title: title, sub: sub, color: color, topics: topics }); }
  function t(title, icon, tip, words) { return { title: title, icon: icon, tip: tip, words: words }; }

  lvl('A1', 'Beginner', 'A1 · Boshlang\'ich', '#22c55e', [
    t('Salomlashish', '💬', "Inglizcha salomlashish: 'Hello' — kun bo'yi, 'Good morning' — ertalab, 'Good night' — uxlashdan oldin. 'Please' va 'sorry' — muloqotdagi eng muhim so'zlar.", `
hello|salom|👋|Hello, my name is Ali.|Salom, mening ismim Ali.
goodbye|xayr;xayr-xo'sh||Goodbye, see you tomorrow.|Xayr, ertagacha ko'rishamiz.
please|iltimos;marhamat||Please sit down.|Iltimos, o'tiring.
sorry|kechirasiz;uzr;afsus||I am sorry I am late.|Kechikkanim uchun uzr.
friend|do'st;o'rtoq||She is my best friend.|U mening eng yaxshi do'stim.
name|ism;nom|📛|What is your name?|Ismingiz nima?
morning|ertalab;tong|🌅|Good morning, teacher.|Xayrli tong, ustoz.
night|tun;kecha|🌙|Good night, mom.|Xayrli tun, onajon.`),
    t('Oila', '👪', "'My' — mening: my mother, my father. Ingliz tilida egalik olmoshi ot oldidan keladi. 'Boy' va 'girl' — bola, 'baby' — chaqaloq.", `
mother|ona;oyi|👩|My mother cooks every day.|Onam har kuni ovqat pishiradi.
father|ota;dada|👨|My father works in a bank.|Otam bankda ishlaydi.
brother|aka;uka;birodar||My brother plays football.|Akam futbol o'ynaydi.
sister|opa;singil||My sister likes music.|Opam musiqani yaxshi ko'radi.
family|oila|👪|I love my family.|Men oilamni yaxshi ko'raman.
baby|chaqaloq;go'dak|👶|The baby is sleeping.|Chaqaloq uxlayapti.
boy|o'g'il bola;bola|👦|The boy has a ball.|Bolaning to'pi bor.
girl|qiz bola;qiz|👧|The girl reads a book.|Qiz kitob o'qiyapti.`),
    t('Ovqat', '🍎', "Sanaladigan otlar oldidan 'a/an' ishlatiladi: an apple, an egg. Sanalmaydigan otlar (water, milk, bread, rice) oldidan ishlatilmaydi.", `
apple|olma|🍎|I eat an apple every day.|Men har kuni olma yeyman.
bread|non|🍞|We buy fresh bread.|Biz yangi non sotib olamiz.
water|suv|💧|Drink more water.|Ko'proq suv iching.
milk|sut|🥛|Milk is good for children.|Sut bolalar uchun foydali.
rice|guruch;osh|🍚|We cook rice for dinner.|Biz kechki ovqatga guruch pishiramiz.
egg|tuxum|🥚|I eat one egg for breakfast.|Men nonushtada bitta tuxum yeyman.
cheese|pishloq|🧀|She likes cheese.|U pishloqni yaxshi ko'radi.
meat|go'sht|🥩|He does not eat meat.|U go'sht yemaydi.`),
    t('Hayvonlar', '🐶', "Ko'plik: ko'p otlarga -s qo'shiladi: cat → cats. Hayvonlar haqida: 'I have a dog' — mening itim bor.", `
cat|mushuk|🐱|The cat sleeps on the sofa.|Mushuk divanda uxlaydi.
dog|it|🐶|My dog is very friendly.|Mening itim juda xushmuomala.
bird|qush|🐦|A bird is singing in the tree.|Daraxtda qush kuylayapti.
fish|baliq|🐟|The fish swims in the river.|Baliq daryoda suzadi.
horse|ot|🐴|He rides a horse.|U ot minadi.
cow|sigir|🐄|The cow gives us milk.|Sigir bizga sut beradi.
lion|sher|🦁|The lion is a strong animal.|Sher kuchli hayvon.
rabbit|quyon|🐰|The rabbit eats a carrot.|Quyon sabzi yeydi.`)
  ]);

  lvl('A2', 'Elementary', 'A2 · Boshlang\'ich+', '#06b6d4', [
    t('Uy', '🏠', "Joy predloglari: in (ichida), on (ustida), under (tagida). 'The book is on the table' — kitob stol ustida.", `
kitchen|oshxona|🍳|My mother is in the kitchen.|Onam oshxonada.
bed|karavot;to'shak|🛏️|The bed is very comfortable.|Karavot juda qulay.
window|deraza|🪟|Please open the window.|Iltimos, derazani oching.
door|eshik|🚪|Close the door, please.|Iltimos, eshikni yoping.
table|stol||The keys are on the table.|Kalitlar stol ustida.
chair|stul|🪑|There is a chair near the wall.|Devor yonida stul bor.
garden|bog';bog'cha|🌳|We have a small garden.|Bizning kichik bog'imiz bor.
room|xona||My room is on the second floor.|Mening xonam ikkinchi qavatda.`),

/* Saqlash qatlami. Hozir: brauzer localStorage (har bir foydalanuvchi uchun alohida kalit).

(function (TY) {
  var SCHEMA = 2, PREFIX = 'tilyoli:';
  var MAX_HEARTS = 5, HEART_MS = 20 * 60 * 1000;

  // ---- Saqlash adapteri (localStorage; bo'lmasa xotirada) ----
  var mem = {};
  var Storage = {
    get: function (k) { try { var v = window.localStorage.getItem(PREFIX + k); return v == null ? null : v; } catch (e) { return mem[k] == null ? null : mem[k]; } },
    set: function (k, v) { try { window.localStorage.setItem(PREFIX + k, v); } catch (e) { mem[k] = v; } },
    remove: function (k) { try { window.localStorage.removeItem(PREFIX + k); } catch (e) { delete mem[k]; } }
  };
  TY.Storage = Storage;

  function today(d) { d = d || new Date(); var m = d.getMonth() + 1, day = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day; }
  function daysBetween(a, b) { var pa = a.split('-'), pb = b.split('-'); return Math.round((Date.UTC(+pb[0], pb[1] - 1, +pb[2]) - Date.UTC(+pa[0], pa[1] - 1, +pa[2])) / 864e5); }
  function addDays(s, n) { var p = s.split('-'); return today(new Date(+p[0], p[1] - 1, +p[2] + n)); }
  TY.today = today; TY.daysBetween = daysBetween; TY.addDays = addDays;

  function newState() {
    return { v: SCHEMA, xp: 0, hearts: MAX_HEARTS, heartTs: Date.now(), streak: 0, bestStreak: 0, lastDay: null,
      goalMin: 10, theme: 'auto', sound: true, speech: true,
      done: {},            // nodeId -> {best: %, times: n, ts}
      words: {},           // wordId -> {c: to'g'ri, w: xato}

      days: {},            // 'YYYY-MM-DD' -> {xp, secs, lessons, correct, wrong}
      ach: {},             // yutuqId -> ts
      quests: {},          // 'YYYY-MM-DD' -> {claimed:true}
      history: [],         // oxirgi sessiyalar natijasi
      ieltsBest: 0 };

  // Migratsiya: eski ma'lumot hech qachon o'chirilmaydi; avval zaxira nusxa olinadi.
  function migrate(s, key) {

    var from = s.v || 1;
    if (from < SCHEMA) {

    { id: 'streak7', icon: '🚀', t: '7 kunlik seriya', d: 'Ketma-ket 7 kun', f: function (s) { return s.bestStreak >= 7; } },
    { id: 'streak30', icon: '👑', t: '30 kunlik seriya', d: 'Ketma-ket 30 kun', f: function (s) { return s.bestStreak >= 30; } },

    { id: 'correct100', icon: '🎯', t: '100 ta to\'g\'ri javob', d: '100 ta to\'g\'ri javob bering', f: function (s) { return Game.totalCorrect(s) >= 100; } },
    { id: 'words50', icon: '📖', t: '50 ta so\'z', d: '50 ta so\'zni o\'rganing', f: function (s) { return Game.learnedCount(s) >= 50; } },
    { id: 'words100', icon: '📚', t: '100 ta so\'z', d: '100 ta so\'zni o\'rganing', f: function (s) { return Game.learnedCount(s) >= 100; } },

    rollStreak: function () {

    },
    streakNow: function () { var s = S(); if (!s.lastDay) return 0; return daysBetween(s.lastDay, today()) > 1 ? 0 : s.streak; },

    },
    checkAchievements: function () {

      return added;
    },
    // Kunlik topshiriqlar: bugungi haqiqiy statistikadan hisoblanadi
    quests: function () {
      var d = day(), s = S();
      return [
        { id: 'q1', icon: '📘', t: 'Bitta dars yoki takrorlashni tugating', cur: d.lessons, goal: 1, xp: 10 },
        { id: 'q2', icon: '🎯', t: '15 ta to\'g\'ri javob bering', cur: d.correct, goal: 15, xp: 15 },
        { id: 'q3', icon: '⚡', t: '40 XP to\'plang', cur: d.xp, goal: 40, xp: 20 },
        { id: 'q4', icon: '⏱️', t: 'Kunlik maqsad: ' + s.goalMin + ' daqiqa', cur: Math.floor(d.secs / 60), goal: s.goalMin, xp: 25 }
      ];
    },
    claimQuests: function () {

<script>
/* Mashqlar mexanikasi: javobni tekshirish, savollarni tuzish va sessiya. UI'dan mustaqil (test qilish oson). */
(function (TY) {
  var G = TY.Game;

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  TY.shuffle = shuffle;

  // Katta-kichik harf, ortiqcha bo'shliq va barcha apostrof turlari farq qilmaydi
  function norm(s) {
    return String(s == null ? '' : s).toLowerCase().replace(/[‘’ʻʼʹ`´′]/g, "'")
      .replace(/[.!?,;:]+$/g, '').replace(/\s+/g, ' ').trim();
  }
  TY.norm = norm;
  function lev1(a, b) { // tahrir masofasi <= 1 mi (faqat maslahat uchun, javobni to'g'ri qilmaydi)
    if (Math.abs(a.length - b.length) > 1) return false;
    var i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
    if (a.length === b.length) return a.slice(i + 1) === b.slice(i + 1) || (a[i] === b[i + 1] && a[i + 1] === b[i] && a.slice(i + 2) === b.slice(i + 2));
    return a.length > b.length ? a.slice(i + 1) === b.slice(i) : b.slice(i + 1) === a.slice(i);
  }
  // Kiritilgan matn qabul qilinadigan javoblardan biriga mosmi
  function checkText(input, accepted) {
    var n = norm(input);
    if (!n) return { ok: false, empty: true };
    for (var i = 0; i < accepted.length; i++) if (norm(accepted[i]) === n) return { ok: true };
    var close = accepted.some(function (a) { return lev1(n, norm(a)); });
    return { ok: false, close: close };
  }
  TY.checkText = checkText;

  // ---- Ovoz (brauzer TTS; bo'lmasa eshitish mashqi tuzilmaydi) ----
  TY.canSpeak = function () { return !!(window.speechSynthesis && window.SpeechSynthesisUtterance); };
  TY.speak = function (text) {
    if (!TY.canSpeak() || !TY.Auth.state || !TY.Auth.state.speech) return;
    try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9; speechSynthesis.speak(u); } catch (e) {}
  };

  function levelPool(w) { return TY.allWords.filter(function (x) { return x.level === w.level && x.id !== w.id; }); }
  function distract(w, key, n) {
    var bad = w.uz.map(norm), seen = {}, out = [];
    shuffle(levelPool(w).concat(shuffle(TY.allWords.filter(function (x) { return x.level !== w.level; })).slice(0, 12))).forEach(function (x) {
      var v = key === 'uz' ? x.uz[0] : x.en, nk = norm(v);
      if (out.length >= n || seen[nk]) return;
      if (key === 'uz' && x.uz.some(function (u) { return bad.indexOf(norm(u)) >= 0; })) return;
      seen[nk] = 1; out.push(v);
    });
    return out;
  }
  function blankSentence(w) {
    var re = new RegExp('\\b' + w.en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
    return re.test(w.sent) ? w.sent.replace(re, '_____') : null;
  }
  function tokens(sent) { return sent.replace(/[.!?]+$/, '').split(/\s+/); }

  // Bitta so'z uchun savol turlari
  var MAKERS = {
    mc_en_uz: function (w) { return { type: 'choice', dir: 'en-uz', w: w.id, prompt: w.en, hint: 'Tarjimasini tanlang', options: shuffle([w.uz[0]].concat(distract(w, 'uz', 3))), answer: w.uz, speak: w.en }; },
    mc_uz_en: function (w) { return { type: 'choice', dir: 'uz-en', w: w.id, prompt: w.uz[0], hint: 'Inglizcha so\'zni toping', options: shuffle([w.en].concat(distract(w, 'en', 3))), answer: [w.en] }; },
    type_en_uz: function (w) { return { type: 'type', w: w.id, prompt: w.en, hint: 'Tarjimasini yozing', answer: w.uz, ph: "O'zbekcha tarjimasi", speak: w.en }; },
    type_uz_en: function (w) { return { type: 'type', w: w.id, prompt: w.uz[0], hint: 'Inglizcha yozing', answer: [w.en], ph: 'Inglizcha so\'z' }; },
    scramble: function (w) {
      var letters = w.en.replace(/[^a-z]/gi, '').split(''); if (letters.length < 3) return null;
      var s, tries = 0; do { s = shuffle(letters); tries++; } while (s.join('') === letters.join('') && tries < 10);
      return { type: 'scramble', w: w.id, prompt: w.uz[0], hint: 'Harflardan so\'z tuzing', letters: s, answer: [w.en.replace(/[^a-z]/gi, '')] };
    },
    cloze: function (w) {
      var b = blankSentence(w); if (!b) return null;
      return { type: 'choice', dir: 'cloze', w: w.id, prompt: b, sub: w.sentUz, hint: "Bo'sh joyni to'ldiring", options: shuffle([w.en].concat(distract(w, 'en', 3))), answer: [w.en] };
    },
    build: function (w) {
      var tk = tokens(w.sent); if (tk.length < 3) return null;
      var extra = shuffle(TY.allWords.filter(function (x) { return x.id !== w.id; })).slice(0, 12).reduce(function (a, x) { return a.concat(tokens(x.sent)); }, []).filter(function (t) { return tk.map(function (z) { return z.toLowerCase(); }).indexOf(t.toLowerCase()) < 0 && /^[a-z]+$/i.test(t); });
      var bank = shuffle(tk.concat(extra.slice(0, 2)));
      return { type: 'build', w: w.id, prompt: w.sentUz, hint: "Gapni inglizcha tuzing", bank: bank, answer: [tk.join(' ')], speak: w.sent };
    },
    listen: function (w) { return TY.canSpeak() ? { type: 'type', w: w.id, prompt: '', listen: w.en, hint: 'Eshitganingizni yozing', answer: [w.en], ph: 'Eshitgan so\'zingiz', speak: w.en } : null; },
    picture: function (w) { return w.emoji ? { type: 'choice', dir: 'picture', w: w.id, prompt: w.emoji, big: true, hint: 'Bu rasm qaysi so\'z?', options: shuffle([w.en].concat(distract(w, 'en', 3))), answer: [w.en] } : null; }
  };
  var EASY = ['mc_en_uz', 'mc_uz_en', 'picture'], HARD = ['type_en_uz', 'type_uz_en', 'scramble', 'cloze', 'build', 'listen'];

  function make(kind, w) { return MAKERS[kind] ? MAKERS[kind](w) : null; }
  function makeAny(w, kinds, avoid) {
    var order = shuffle(kinds);
    if (avoid) order.sort(function (a, b) { return (a === avoid) - (b === avoid); });
    for (var i = 0; i < order.length; i++) { var q = make(order[i], w); if (q) { q.kind = order[i]; return q; } }
    return null;
  }
  function matchQ(ws) {
    var left = ws.map(function (w) { return { id: w.id, t: w.en }; }), right = ws.map(function (w) { return { id: w.id, t: w.uz[0] }; });
    return { type: 'match', kind: 'match', hint: 'Juftlarini toping', left: shuffle(left), right: shuffle(right), ws: ws.map(function (w) { return w.id; }) };
  }
  function nonRepeat(qs) { // ketma-ket bir xil turdagi savollarni kamaytirish
    for (var i = 1; i < qs.length; i++) if (qs[i].kind === qs[i - 1].kind) { for (var j = i + 1; j < qs.length; j++) if (qs[j].kind !== qs[i - 1].kind) { var t = qs[i]; qs[i] = qs[j]; qs[j] = t; break; } }
    return qs;
  }

  // Sessiya tuzish. mode: lesson | review | test | mistakes | practice
  function build(mode, node) {
    var s = TY.Auth.state, words, qs = [];
    if (mode === 'lesson') {
      words = TY.LEVELS[node.level].topics[node.topic].words;
      var easy = shuffle(words).map(function (w) { var q = makeAny(w, EASY); q.firstSeen = true; return q; });
      var mt = matchQ(shuffle(words).slice(0, 5));
      var hard = shuffle(words).map(function (w) { return makeAny(w, HARD); });
      qs = nonRepeat(easy).concat([mt], nonRepeat(hard));
      var old = Object.keys(s.mistakes).filter(function (id) { return !words.some(function (w) { return w.id === id; }); });
      shuffle(old).slice(0, 3).forEach(function (id) { var q = makeAny(TY.wordById[id], EASY.concat(['type_en_uz'])); if (q) { q.review = true; qs.push(q); } });
    } else if (mode === 'review' || mode === 'test') {
      var lv = TY.LEVELS[node.level], all = [];
      lv.topics.forEach(function (tp) { all = all.concat(tp.words); });
      var weighted = shuffle(all).sort(function (a, b) { return (s.mistakes[b.id] ? 1 : 0) - (s.mistakes[a.id] ? 1 : 0); });
      var n = mode === 'test' ? 14 : 10; words = weighted.slice(0, n);
      var kinds = mode === 'test' ? HARD.concat(['mc_en_uz', 'mc_uz_en', 'cloze']) : EASY.concat(HARD);
      qs = nonRepeat(shuffle(words).map(function (w) { return makeAny(w, kinds); }));
      qs.splice(Math.floor(qs.length / 2), 0, matchQ(shuffle(all).slice(0, 5)));
    } else { // mistakes | practice
      var ids = mode === 'mistakes' ? Object.keys(s.mistakes) : [];
      if (mode === 'practice') TY.LEVELS.forEach(function (lv) { lv.topics.forEach(function (tp) { if (s.done[tp.id]) ids = ids.concat(tp.words.map(function (w) { return w.id; })); }); });
      words = shuffle(ids).slice(0, 12).map(function (id) { return TY.wordById[id]; });
      qs = nonRepeat(words.map(function (w) { var q = makeAny(w, EASY.concat(HARD)); return q; }));
      if (words.length >= 4) qs.splice(Math.min(3, qs.length), 0, matchQ(words.slice(0, 5)));
    }
    qs = qs.filter(Boolean);
    return { mode: mode, node: node || null, words: words, queue: qs };
  }
  TY.buildSession = build;

  // ---- Sessiya holati ----
  function Session(mode, node) {
    var b = build(mode, node);
    this.mode = mode; this.node = node; this.words = b.words; this.queue = b.queue; this.total = b.queue.length;
    this.i = 0; this.firstTry = 0; this.xp = 0; this.wrong = {}; this.right = {}; this.start = Date.now(); this.qStart = Date.now();
    this.over = false; this.failed = false; this.useHearts = (mode === 'lesson' || mode === 'review' || mode === 'test');
  }
  Session.prototype.current = function () { return this.queue[this.i]; };
  Session.prototype.progress = function () { return this.total ? Math.min(1, (this.i) / this.total) : 1; };
  Session.prototype.tick = function () { var now = Date.now(); G.addTime((now - this.qStart) / 1000); this.qStart = now; };
  // wordIds: savoldagi so'zlar; ok: to'g'ri/noto'g'ri. Qaytaradi: {xp, heartsLeft, outOfHearts}
  Session.prototype.answer = function (q, ok, wordIds, firstAttempt) {
    var self = this; this.tick();
    (wordIds || [q.w]).forEach(function (id) { G.recordAnswer(id, ok); (ok ? self.right : self.wrong)[id] = 1; });
    var res = { xp: 0, outOfHearts: false };
    if (ok) {
      res.xp = q.retry ? 5 : 10; this.xp += res.xp; G.addXP(res.xp); if (!q.retry) this.firstTry++;
    } else if (this.useHearts && !q.heartLost) {
      q.heartLost = true; G.loseHeart();
      if (TY.Auth.state.hearts <= 0) { res.outOfHearts = true; this.over = true; this.failed = true; }
    }
    if (!ok && !q.retry) { // xato savol bir marta oxiriga qaytariladi
      var copy = JSON.parse(JSON.stringify(q)); copy.retry = true; copy.heartLost = true; delete copy.firstSeen;
      if (copy.type === 'match') copy.left = shuffle(copy.left), copy.right = shuffle(copy.right);
      this.queue.push(copy);
    }
    TY.Auth.save();
    res.heartsLeft = TY.Auth.state.hearts; return res;
  };
  // Juftlashtirish: butun savol bir marta hisoblanadi (xato juftliklar so'z bo'yicha yoziladi)
  Session.prototype.answerMatch = function (q, wrongIds) {
    var self = this, ok = wrongIds.length === 0; this.tick();
    q.ws.forEach(function (id) { var bad = wrongIds.indexOf(id) >= 0; G.recordAnswer(id, !bad); (bad ? self.wrong : self.right)[id] = 1; });
    var res = { xp: ok ? 10 : 5, outOfHearts: false };
    this.xp += res.xp; G.addXP(res.xp); if (ok && !q.retry) this.firstTry++;
    if (!ok && this.useHearts) { G.loseHeart(); if (TY.Auth.state.hearts <= 0) { res.outOfHearts = true; this.over = true; this.failed = true; } }
    TY.Auth.save(); res.heartsLeft = TY.Auth.state.hearts; return res;
  };
  Session.prototype.next = function () { this.i++; this.qStart = Date.now(); if (this.i >= this.queue.length) this.over = true; };
  Session.prototype.percent = function () { return this.total ? Math.round(100 * this.firstTry / this.total) : 100; };
  // Dars yakuni: bonus XP, saqlash, yutuqlar
  Session.prototype.finish = function () {
    var pct = this.percent(), m = this.mode, out = { pct: pct, passed: true, bonus: 0, ach: [], unlockedNext: false };
    if (m === 'test' && pct < 75) out.passed = false;
    if (out.passed) {
      out.bonus = m === 'test' ? 40 : m === 'review' ? 25 : m === 'lesson' ? 20 : 15;
      if (pct === 100 && m !== 'practice' && m !== 'mistakes') out.bonus += 10;
      this.xp += out.bonus;
      var r = (m === 'lesson' || m === 'review' || m === 'test') ? G.completeNode(this.node.id, pct, out.bonus, 0) : G.completePractice(out.bonus);
      out.ach = r.ach; out.unlockedNext = !!(this.node && r.first);
    } else { TY.Auth.save(); }
    this.tick(); TY.Auth.save();
    var st = TY.Auth.state; st.history.unshift({ ts: Date.now(), mode: m, node: this.node && this.node.id, pct: pct, xp: this.xp, ok: out.passed }); st.history = st.history.slice(0, 50); TY.Auth.save();
    out.xp = this.xp; return out;
  };
  TY.Session = Session;

  // Yagona javob tekshiruvi (UI tomonidan chaqiriladi)
  TY.gradeQuestion = function (q, input) {
    if (q.type === 'choice') { var ok = checkText(input, q.answer).ok; return { ok: ok, correct: q.answer[0] }; }
    if (q.type === 'type') { var r = checkText(input, q.answer); r.correct = q.answer[0]; return r; }
    if (q.type === 'scramble') { var rs = checkText(input, q.answer); rs.correct = q.answer[0]; return rs; }
    if (q.type === 'build') { var rb = norm(input.join(' ')) === norm(q.answer[0]); return { ok: rb, correct: q.answer[0] }; }
    return { ok: false };
  };
  // Xato javobdan keyin ko'rsatiladigan qisqa tushuntirish
  TY.explain = function (q) {
    var w = TY.wordById[q.w]; if (!w) return '';
    return w.en + ' — ' + w.uz.join(', ') + '. Misol: ' + w.sent + ' (' + w.sentUz + ')';
  };
})(window.TY = window.TY || {});

</script>
<script>
/* Interfeys: marshrutlash, sahifalar va dars oynasi. */
(function (TY) {
  var A = TY.Auth, G = TY.Game, $ = function (s, r) { return (r || document).querySelector(s); };
  var app = $('#app'), lessonEl = $('#lesson'), modalEl = $('#modal');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function st() { return A.state; }

  // ---- Tema, tovush, xabarlar ----
  function applyTheme() {
    var t = st() ? st().theme : 'auto', dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    try { localStorage.setItem('tilyoli:pref', JSON.stringify({ theme: t })); } catch (e) {}
  }
  var actx;
  function beep(kind) {
    if (!st() || !st().sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var seq = kind === 'good' ? [[660, 0], [880, .09]] : kind === 'bad' ? [[200, 0], [150, .12]] : [[523, 0], [659, .1], [784, .2]];
      seq.forEach(function (n) { var o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = n[0]; g.gain.value = .06; o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + n[1]); o.stop(actx.currentTime + n[1] + .12); });
    } catch (e) {}
  }
  function toast(msg) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; $('#toasts').appendChild(d); setTimeout(function () { d.remove(); }, 3200); }
  function modal(html, onClose) {

    modalEl._close = onClose; var f = $('button, a, input', modalEl); if (f) f.focus();
  }
  function closeModal() { modalEl.hidden = true; modalEl.innerHTML = ''; if (modalEl._close) { var c = modalEl._close; modalEl._close = null; c(); } }
  modalEl.addEventListener('click', function (e) { if (e.target === modalEl) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modalEl.hidden) closeModal(); });

  // ---- Marshrutlash ----
  var NAV = [['#/', '🏠', 'Bosh sahifa'], ['#/learn', '🗺️', 'Xarita'], ['#/review', '🔁', 'Takrorlash'], ['#/quests', '🎯', 'Topshiriqlar'], ['#/ielts', '🎓', 'IELTS'], ['#/stats', '📊', 'Statistika'], ['#/achievements', '🏆', 'Yutuqlar'], ['#/profile', '👤', 'Profil']];

  function route() {

        '<div class="card"><form class="form" id="af" novalidate><label for="u">Foydalanuvchi nomi</label><input class="inp" id="u" autocomplete="username" required>' +
        '<label for="p">Parol</label><input class="inp" id="p" type="password" autocomplete="' + (mode === 'login' ? 'current-password' : 'new-password') + '" required>' +
        '<p class="err" role="alert" id="err">' + esc(err || '') + '</p><button class="btn block" type="submit">' + (mode === 'login' ? 'Kirish' : 'Ro\'yxatdan o\'tish') + '</button></form></div>' +
        '<div class="row" style="justify-content:center"><button class="btn ghost small" id="sw">' + (mode === 'login' ? 'Hisobim yo\'q' : 'Hisobim bor') + '</button><button class="btn ghost small" id="gst">Mehmon sifatida</button></div>' +
        '<p class="mute center" style="margin-top:1rem;font-size:.85rem">Ma\'lumotlar faqat shu qurilma brauzerida saqlanadi (server yo\'q).</p></main>';

  // ---- Bosh sahifa ----
  function ringSVG(p, label) {

  }
  function todayInfo() { var s = st(), d = s.days[TY.today()] || { xp: 0, secs: 0, lessons: 0, correct: 0, wrong: 0 }; return d; }
  function vHome() {
    var s = st(), d = todayInfo(), goal = s.goalMin * 60, p = Math.min(1, d.secs / goal), cur = G.currentNode(), b = G.levelBounds(s.xp);
    var hello = 'Salom, ' + esc(A.current.name) + '!';
    var hero = cur ? '<section class="card hero"><div><h2>' + (G.learnedCount(s) ? 'Davom etamiz' : 'Boshlaymiz') + '</h2><p>' + esc(TY.LEVELS[cur.level].sub) + ' · ' + esc(cur.title) + '</p></div><a class="btn" href="#/lesson/' + cur.id + '">' + cur.icon + ' ' + (s.done[cur.id] ? 'Takrorlash' : 'Boshlash') + '</a></section>'

      '<div class="grid g2"><section class="card row" aria-labelledby="gh"><div><h3 id="gh">Kunlik maqsad</h3><p class="mute">' + Math.floor(d.secs / 60) + ' / ' + s.goalMin + ' daqiqa</p><a href="#/profile">Maqsadni o\'zgartirish</a></div>' + ringSVG(p, 'Kunlik maqsad ' + Math.round(p * 100) + ' foiz') + '</section>' +
      '<section class="card"><h3>Daraja ' + b.lvl + '</h3><div class="bar yellow" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(100 * (s.xp - b.from) / (b.to - b.from)) + '"><i style="width:' + (100 * (s.xp - b.from) / (b.to - b.from)) + '%"></i></div><p class="mute" style="margin-top:.5rem">' + (b.to - s.xp) + ' XP keyingi darajagacha</p></section></div>' +
      '<div class="grid g3"><div class="card stat"><b>🔥 ' + G.streakNow() + '</b>kunlik seriya</div><div class="card stat"><b>⚡ ' + d.xp + '</b>bugungi XP</div><div class="card stat"><b>📖 ' + G.learnedCount(s) + '</b>o\'rganilgan so\'z</div></div>' +

      (Object.keys(s.mistakes).length ? '<section class="card row"><div><h3>Xato so\'zlar: ' + Object.keys(s.mistakes).length + '</h3><p class="mute" style="margin:0">Ularni takrorlab yurakcha ham tiklang.</p></div><a class="btn blue small" href="#/practice/mistakes">Takrorlash</a></section>' : '');

  // ---- Xarita ----
  var OFFS = [0, 38, 58, 38, 0, -38, -58];
  function levelUnlocked(li) { return li === 0 || !!st().done[TY.LEVELS[li - 1].nodes[TY.LEVELS[li - 1].nodes.length - 1].id]; }

  // ---- Takrorlash markazi ----
  function vReview() {

      '<p><b>Tiklash qoidalari:</b></p><ul><li>Har <b>20 daqiqada +1</b> yurakcha o\'zi tiklanadi' + (nh ? ' (keyingisi: <b>' + fmtMs(nh) + '</b>)' : '') + '.</li><li>Xato so\'zlar yoki umumiy mashqni tugatsangiz <b>+1</b> yurakcha (mashq paytida yurakcha ketmaydi).</li><li>Dars, takrorlash yoki sinovni tugatsangiz <b>+1</b> yurakcha.</li></ul></section>' +
      '<div class="grid g2"><section class="card"><h3>🧩 Xato so\'zlar (' + mk.length + ')</h3><p class="mute">Xato qilgan so\'zlar. Ketma-ket 2 marta to\'g\'ri topsangiz ro\'yxatdan chiqadi.</p><a class="btn blue block' + '" ' + (mk.length ? '' : 'aria-disabled="true" style="pointer-events:none;opacity:.5"') + ' href="#/practice/mistakes">Mashq qilish</a></section>' +
      '<section class="card"><h3>🔀 Aralash mashq</h3><p class="mute">O\'rganilgan so\'zlar (' + learned + ') aralashtirilib so\'raladi.</p><a class="btn block" ' + (learned ? '' : 'aria-disabled="true" style="pointer-events:none;opacity:.5"') + ' href="#/practice/practice">Boshlash</a></section></div>' +
      (list ? '<section class="card"><h3>Xato so\'zlar ro\'yxati</h3><table class="t"><tr><th>Inglizcha</th><th>Tarjima</th><th>Xato</th></tr>' + list + '</table></section>' : '<p class="mute center">Hozircha xato so\'zlar yo\'q. Zo\'r! 🎉</p>');

  // ---- Topshiriqlar ----

  function vStats() {
    var s = st(), days = [], i, t = TY.today(), names = ['Ya', 'Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh'];
    for (i = 6; i >= 0; i--) { var k = TY.addDays(t, -i), d = s.days[k] || { xp: 0, secs: 0 }; var p = k.split('-'); days.push({ k: k, xp: d.xp, min: Math.round(d.secs / 60), n: names[new Date(+p[0], p[1] - 1, +p[2]).getDay()] }); }
    var mx = Math.max.apply(null, days.map(function (d) { return d.xp; }).concat([10]));
    var cor = G.totalCorrect(s), wr = Object.keys(s.days).reduce(function (a, k) { return a + s.days[k].wrong; }, 0), les = Object.keys(s.days).reduce(function (a, k) { return a + s.days[k].lessons; }, 0), secs = Object.keys(s.days).reduce(function (a, k) { return a + s.days[k].secs; }, 0);
    var d0 = s.days[t] || { xp: 0, secs: 0, lessons: 0, correct: 0, wrong: 0 };
    var hist = s.history.slice(0, 10).map(function (h) { var n = h.node && TY.nodeById[h.node]; var lab = n ? TY.LEVELS[n.level].id + ' · ' + n.title : { practice: 'Aralash mashq', mistakes: 'Xato so\'zlar' }[h.mode] || h.mode; return '<tr><td>' + new Date(h.ts).toLocaleDateString('uz') + '</td><td>' + esc(lab) + '</td><td>' + h.pct + '%</td><td>+' + h.xp + '</td></tr>'; }).join('');
    return '<h1>Statistika</h1><div class="grid g3"><div class="card stat"><b>⚡ ' + s.xp + '</b>jami XP</div><div class="card stat"><b>🔥 ' + G.streakNow() + '</b>seriya (eng yaxshi ' + s.bestStreak + ')</div><div class="card stat"><b>🎯 ' + (cor + wr ? Math.round(100 * cor / (cor + wr)) : 0) + '%</b>aniqlik</div><div class="card stat"><b>📖 ' + G.learnedCount(s) + '</b>so\'z</div><div class="card stat"><b>✅ ' + les + '</b>tugatilgan mashg\'ulot</div><div class="card stat"><b>⏱️ ' + Math.round(secs / 60) + '</b>daqiqa jami</div></div>' +

      '<section class="card"><h3>Oldingi natijalar</h3>' + (hist ? '<table class="t"><tr><th>Sana</th><th>Mashg\'ulot</th><th>Natija</th><th>XP</th></tr>' + hist + '</table>' : '<p class="mute">Hali natija yo\'q.</p>') + '</section>';
  }

  // ---- Dars oynasi ----
  function startRoute(name, arg) {
    var mode, node = null;

      node = TY.nodeById[arg]; if (!node) { location.hash = '#/learn'; return; }
      if (!G.isUnlocked(node.id)) { toast('🔒 Avval oldingi darsni tugating'); location.hash = '#/learn'; return; }

    } else mode = arg === 'mistakes' ? 'mistakes' : 'practice';

    if (!session.queue.length) { toast('Mashq uchun so\'z yo\'q'); location.hash = '#/review'; return; }
    app.hidden = true; lessonEl.hidden = false;
    if (mode === 'lesson') introScreen(); else nextQuestion();
  }
  function stopLesson() { session = null; lessonEl.hidden = true; lessonEl.innerHTML = ''; if (cleanupLesson) { cleanupLesson(); cleanupLesson = null; } }
  function lHead() {
    return '<div class="l-top"><button class="x" data-act="quit" aria-label="Darsdan chiqish">✕</button><div class="bar" role="progressbar" aria-label="Dars progressi" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(session.progress() * 100) + '"><i style="width:' + session.progress() * 100 + '%"></i></div>' + (session.useHearts ? '<span class="chip heart" aria-label="Yurakchalar">❤️ ' + st().hearts + '</span>' : '<span class="chip">∞</span>') + '</div>';
  }

      '<div class="card">' + tp.words.map(function (w) { return '<div class="wcard"><span class="e" aria-hidden="true">' + (w.emoji || '🔤') + '</span><div><b>' + esc(w.en) + '</b> — ' + esc(w.uz.join(', ')) + '<br><small class="mute">' + esc(w.sent) + '</small></div><button class="spk" data-act="say" data-t="' + esc(w.en) + '" aria-label="' + esc(w.en) + ' so\'zini eshitish">🔊</button></div>'; }).join('') + '</div></div>' +
      '<div class="fb"><div class="fb-in"><span class="mute">Maqsad: ' + tp.words.length + ' ta so\'z</span><button class="btn" data-act="begin" id="primary">Mashqni boshlash</button></div></div>';
    $('#primary').focus();
  }

  var cur = null; // joriy savol holati
  function nextQuestion() {
    if (session.over) return finishSession();
    var q = session.current(); cur = { q: q, sel: null, checked: false, picked: [], matched: {}, wrongM: [], mSel: null };
    var body = '', k = q.type;
    var speakBtn = q.speak && q.dir !== 'uz-en' ? '<button class="spk" data-act="say" data-t="' + esc(q.speak) + '" aria-label="Eshitish">🔊</button>' : '';
    if (q.listen && TY.canSpeak()) { setTimeout(function () { TY.speak(q.listen); }, 250); }
    if (k === 'choice') {
      body = '<p class="q-hint">' + esc(q.hint) + '</p><div class="q-prompt' + (q.big ? ' big' : '') + '">' + (q.big ? '<span role="img" aria-label="Rasm">' + q.prompt + '</span>' : '<span>' + esc(q.prompt) + '</span>') + speakBtn + '</div>' + (q.sub ? '<p class="mute">' + esc(q.sub) + '</p>' : '') +
        '<div class="opts" role="radiogroup" aria-label="Javob variantlari">' + q.options.map(function (o, i) { return '<button class="opt" role="radio" aria-checked="false" data-act="opt" data-i="' + i + '"><kbd>' + (i + 1) + '</kbd>' + esc(o) + '</button>'; }).join('') + '</div>';
    } else if (k === 'type') {
      body = '<p class="q-hint">' + esc(q.hint) + '</p>' + (q.listen ? '<div class="q-prompt"><button class="spk" data-act="say" data-t="' + esc(q.listen) + '" aria-label="Qayta eshitish" style="width:80px;height:80px;font-size:2.2rem">🔊</button></div>' : '<div class="q-prompt"><span>' + esc(q.prompt) + '</span>' + speakBtn + '</div>') +
        '<label class="sr" for="ti">Javobingiz</label><input class="inp" id="ti" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + esc(q.ph || '') + '">';
    } else if (k === 'scramble' || k === 'build') {
      var items = k === 'scramble' ? q.letters : q.bank;
      body = '<p class="q-hint">' + esc(q.hint) + '</p><div class="q-prompt"><span>' + esc(q.prompt) + '</span>' + speakBtn + '</div><div class="tray" id="tray" aria-label="Sizning javobingiz" aria-live="polite"></div><div class="tray" style="border:0" id="bank">' + items.map(function (t, i) { return '<button class="tile" data-act="tile" data-i="' + i + '">' + esc(t) + '</button>'; }).join('') + '</div>';
    } else if (k === 'match') {
      body = '<p class="q-hint">' + esc(q.hint) + '</p><div class="mcols"><div class="grid" id="ml">' + q.left.map(function (o) { return '<button class="opt" data-act="m" data-side="l" data-id="' + o.id + '">' + esc(o.t) + '</button>'; }).join('') + '</div><div class="grid" id="mr">' + q.right.map(function (o) { return '<button class="opt" data-act="m" data-side="r" data-id="' + o.id + '">' + esc(o.t) + '</button>'; }).join('') + '</div></div>';
    }
    var tag = q.review ? '<p class="mute">🔁 Oldingi xatolarni takrorlash</p>' : q.retry ? '<p class="mute">↩️ Qayta urinib ko\'ring</p>' : '';
    lessonEl.innerHTML = lHead() + '<div class="l-body">' + tag + body + '</div><div class="fb" id="fb"><div class="fb-in"><span class="msg" id="msg" role="status" aria-live="polite"></span>' +
      (k === 'match' ? '' : '<button class="btn" id="primary" data-act="check" disabled>Tekshirish</button>') + '</div></div>';
    if (k === 'type') { var ti = $('#ti'); ti.focus(); ti.oninput = function () { $('#primary').disabled = !ti.value.trim(); }; }

  function feedback(ok, q, extra) {
    var fb = $('#fb'); fb.className = 'fb pop ' + (ok ? 'good' : 'bad');
    var w = TY.wordById[q.w];
    $('#msg').innerHTML = ok ? '<b>' + esc(['To\'g\'ri!', 'Ajoyib!', 'Zo\'r!', 'Barakalla!'][Math.floor(Math.random() * 4)]) + '</b><small>+' + (extra && extra.xp || 10) + ' XP</small>'
      : '<b>' + (extra && extra.close ? 'Deyarli! Imlo xatosi.' : 'Noto\'g\'ri') + '</b><small>To\'g\'ri javob: <b>' + esc(extra && extra.correct || '') + '</b></small><small>' + esc(w ? TY.explain(q) : '') + '</small>';
    beep(ok ? 'good' : 'bad');
  }
  function afterAnswer(res, ok) {
    var primary = $('#primary');
    if (!primary) { var fbin = $('.fb-in'); primary = document.createElement('button'); primary.className = 'btn'; primary.id = 'primary'; fbin.appendChild(primary); }
    primary.disabled = false; primary.className = 'btn' + (ok ? '' : ' red'); primary.dataset.act = res.outOfHearts ? 'hearts' : 'next'; primary.textContent = res.outOfHearts ? 'Davom etish' : 'Davom etish';
    var hc = $('.l-top .chip.heart'); if (hc) hc.textContent = '❤️ ' + st().hearts;
    var pb = $('.l-top .bar'); pb.firstChild.style.width = Math.min(100, 100 * (session.i + 1) / session.queue.length) + '%';
    primary.focus();
  }
  function check() {
    var q = cur.q; if (cur.checked) return; var input;
    if (q.type === 'choice') { if (cur.sel == null) return; input = q.options[cur.sel]; }
    else if (q.type === 'type') input = $('#ti').value;
    else if (q.type === 'scramble') input = cur.picked.map(function (i) { return q.letters[i]; }).join('');
    else input = cur.picked.map(function (i) { return q.bank[i]; });
    var g = TY.gradeQuestion(q, input); if (g.empty) return;
    cur.checked = true;
    var res = session.answer(q, g.ok, [q.w]);
    if (q.type === 'choice') document.querySelectorAll('.opt').forEach(function (b) { var o = q.options[+b.dataset.i]; b.disabled = true; if (TY.checkText(o, q.answer).ok) b.classList.add('good'); else if (+b.dataset.i === cur.sel) b.classList.add('bad'); });
    if (q.type === 'type') $('#ti').disabled = true;
    feedback(g.ok, q, { xp: res.xp, correct: g.correct, close: g.close });
    afterAnswer(res, g.ok);
  }
  function matchClick(btn) {
    var side = btn.dataset.side, id = btn.dataset.id; if (btn.classList.contains('gone') || cur.checked) return;
    document.querySelectorAll('.opt.sel[data-side="' + side + '"]').forEach(function (b) { b.classList.remove('sel'); });

      var a = cur.mL, b = cur.mR;
      if (a.dataset.id === b.dataset.id) { a.classList.remove('sel'); b.classList.remove('sel'); a.classList.add('good'); b.classList.add('good'); beep('good'); setTimeout(function () { a.classList.add('gone'); b.classList.add('gone'); }, 350); cur.matched[a.dataset.id] = 1; }
      else { [a, b].forEach(function (x) { x.classList.add('bad', 'shake'); setTimeout(function () { x.classList.remove('bad', 'shake', 'sel'); }, 450); }); beep('bad'); if (cur.wrongM.indexOf(a.dataset.id) < 0) cur.wrongM.push(a.dataset.id); if (cur.wrongM.indexOf(b.dataset.id) < 0) cur.wrongM.push(b.dataset.id); }
      cur.mL = cur.mR = null;
      if (Object.keys(cur.matched).length === cur.q.ws.length) {
        cur.checked = true; var res = session.answerMatch(cur.q, cur.wrongM), ok = !cur.wrongM.length;
        setTimeout(function () { var fb = $('#fb'); fb.className = 'fb pop ' + (ok ? 'good' : 'bad'); $('#msg').innerHTML = ok ? '<b>Hammasi to\'g\'ri!</b><small>+' + res.xp + ' XP</small>' : '<b>Tugadi</b><small>Xato juftliklar xato so\'zlar ro\'yxatiga qo\'shildi. +' + res.xp + ' XP</small>'; afterAnswer(res, ok); }, 450);
      }
    }
  }
  function tileClick(btn) {

    var items = q.type === 'scramble' ? q.letters : q.bank;
    $('#tray').innerHTML = cur.picked.map(function (j) { return '<button class="tile" data-act="tile" data-in="1" data-i="' + j + '" aria-label="' + esc(items[j]) + ' ni olib tashlash">' + esc(items[j]) + '</button>'; }).join('');
    document.querySelectorAll('#bank .tile').forEach(function (b) { b.disabled = cur.picked.indexOf(+b.dataset.i) >= 0; });
    $('#primary').disabled = !cur.picked.length;
  }
  function next() { session.next(); nextQuestion(); }

      '<p class="mute" style="margin:0">Mashq rejimida yurakcha ketmaydi; uni tugatsangiz +1 ❤️ olasiz.' + (G.learnedCount(st()) ? '' : ' (Avval kamida bitta dars tugating — hozircha mashq uchun so\'z yo\'q.)') + '</p>' +
      '<button class="btn ghost block" data-act="gomap">🗺️ Xaritaga qaytish</button><p class="mute center" style="margin:0">Yoki kuting: keyingi ❤️ ' + fmtMs(nh) + ' dan keyin (har 20 daqiqada +1).</p></div>', function () { if (fromStart && /lesson|practice/.test(location.hash)) location.hash = '#/learn'; });
    if (fromStart) { lessonEl.hidden = true; shell('#/learn', vLearn()); }
  }
  function finishSession() {
    if (session.failed && !session.finished) { outOfHearts(session); lessonEl.innerHTML = ''; return; }
    var s = session, r = s.finish(); s.finished = true;
    var learned = (s.mode === 'lesson' || s.mode === 'test' || s.mode === 'review') ? s.words : s.words;
    var wrongIds = Object.keys(s.wrong), nextN = r.unlockedNext && s.node ? TY.NODES[s.node.order + 1] : null;
    var next = s.node && r.passed ? (nextN || null) : null;
    beep('win');
    lessonEl.innerHTML = '<div class="l-body center"><div class="big-emoji pop">' + (r.passed ? (r.pct >= 90 ? '🏆' : '🎉') : '😕') + '</div><h1>' + (r.passed ? 'Mashg\'ulot tugadi!' : 'Sinovdan o\'ta olmadingiz') + '</h1>' +
      '<div class="grid g3" style="margin:1rem 0"><div class="card stat"><b>⚡ ' + r.xp + '</b>XP</div><div class="card stat"><b>🎯 ' + r.pct + '%</b>aniqlik</div><div class="card stat"><b>⏱️ ' + Math.max(1, Math.round((Date.now() - s.start) / 60000)) + '</b>daqiqa</div></div>' +
      (r.passed ? '<p class="mute">Bonus: +' + r.bonus + ' XP' + (s.useHearts ? ' · +1 ❤️' : ' · +1 ❤️') + '</p>' : '<p>Kamida 75% kerak. Takrorlab, yana urinib ko\'ring.</p>') +
      (r.ach.length ? '<div class="card" style="background:var(--yellow-l)"><b>🏅 Yangi yutuq!</b><br>' + r.ach.map(function (a) { return a.icon + ' ' + esc(a.t); }).join('<br>') + '</div>' : '') +
      '<div class="card" style="text-align:left"><h3>So\'zlar</h3><div class="words">' + (s.words || []).map(function (w) { return '<span class="pill" style="' + (s.wrong[w.id] ? 'border-color:var(--red)' : '') + '">' + esc(w.en) + ' — ' + esc(w.uz[0]) + '</span>'; }).join('') + '</div>' + (wrongIds.length ? '<p class="mute">Qizil bilan — xato qilingan so\'zlar (' + wrongIds.length + ').</p>' : '') + '</div>' +
      '<div class="grid">' + (wrongIds.length ? '<a class="btn blue block" href="#/practice/mistakes">🔁 Xatolarni takrorlash</a>' : '') +
      (next ? '<a class="btn block" href="#/lesson/' + next.id + '">Keyingi: ' + esc(next.title) + ' →</a>' : '') + (!r.passed && s.node ? '<a class="btn block" href="#/lesson/' + s.node.id + '">Qayta urinish</a>' : '') +
      '<button class="btn ghost block" data-act="gomap" id="primary">🗺️ Xaritaga</button></div></div>';
    $('#primary').focus();
    try { history.replaceState(null, '', '#/learn'); } catch (er) {}  // yangilaganda dars qayta boshlanmasin
  }

  // ---- Hodisalar (delegatsiya) ----
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return; var act = b.dataset.act, q;
    if (act === 'node') nodeSheet(b.dataset.id);
    else if (act === 'close') closeModal();
    else if (act === 'gomap') { closeModal(); if (location.hash === '#/learn') route(); else location.hash = '#/learn'; }
    else if (act === 'begin') nextQuestion();
    else if (act === 'say') TY.speak(b.dataset.t);
    else if (act === 'opt') { if (cur.checked) return; cur.sel = +b.dataset.i; document.querySelectorAll('.opt').forEach(function (o) { var on = o === b; o.classList.toggle('sel', on); o.setAttribute('aria-checked', on); }); $('#primary').disabled = false; }
    else if (act === 'check') check();
    else if (act === 'next') next();
    else if (act === 'hearts') { session.finished = true; outOfHearts(session); }
    else if (act === 'm') matchClick(b);
    else if (act === 'tile') tileClick(b);
    else if (act === 'quit') {
      modal('<h2>Chiqasizmi?</h2><p>Hozirgi mashg\'ulot progressi saqlanmaydi (to\'plangan XP qoladi).</p><div class="grid"><button class="btn block" data-act="close">Davom etish</button><button class="btn red block" data-act="leave">Chiqish</button></div>');
    }
    else if (act === 'leave') { closeModal(); session = null; location.hash = '#/learn'; }
    else if (act === 'more') modal('<h2>Yana</h2><div class="grid">' + [4, 5, 6].map(function (i) { return '<a class="btn ghost block" href="' + NAV[i][0] + '">' + NAV[i][1] + ' ' + NAV[i][2] + '</a>'; }).join('') + '</div>');
    else if (act === 'claim') { var g = G.claimQuests(); if (g) { toast('🎁 +' + g + ' XP olindi!'); beep('win'); } route(); }
    else if (act === 'set') { st()[b.dataset.k] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; A.save(); applyTheme(); route(); }
    else if (act === 'tog') { st()[b.dataset.k] = !st()[b.dataset.k]; A.save(); route(); }
    else if (act === 'export') { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([A.exportData()], { type: 'application/json' })); a.download = 'tilyoli-' + TY.today() + '.json'; a.click(); }
    else if (act === 'reset') modal('<h2>Progressni tozalash?</h2><p>XP, seriya, tugallangan darslar va yutuqlar o\'chadi. Avval eksport qilib oling.</p><div class="grid"><button class="btn red block" data-act="reset2">Ha, tozalash</button><button class="btn ghost block" data-act="close">Bekor qilish</button></div>');
    else if (act === 'reset2') { A.resetProgress(); closeModal(); route(); toast('Progress tozalandi'); }
    else if (act === 'logout') { A.logout(); location.hash = '#/'; route(); }
    else if (act === 'del') modal('<h2>Hisobni o\'chirish?</h2><p>Hisob va barcha ma\'lumotlar butunlay o\'chadi.</p><div class="grid"><button class="btn red block" data-act="del2">Ha, o\'chirish</button><button class="btn ghost block" data-act="close">Bekor qilish</button></div>');
    else if (act === 'del2') { A.deleteAccount(); closeModal(); route(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'imp' && e.target.files[0]) { var r = new FileReader(); r.onload = function () { try { A.importData(r.result); applyTheme(); toast('Import qilindi'); route(); } catch (er) { toast('Xato: ' + er.message); } }; r.readAsText(e.target.files[0]); }
  });
  document.addEventListener('keydown', function (e) {
    if (lessonEl.hidden || !cur || !modalEl.hidden) { return; }
    var q = cur.q;
    if (e.key === 'Enter') {
      var p = $('#primary'); if (p && !p.disabled) { e.preventDefault(); p.click(); }
    } else if (q && q.type === 'choice' && !cur.checked && /^[1-4]$/.test(e.key)) { var o = document.querySelectorAll('.opt')[+e.key - 1]; if (o) o.click(); }
    else if (q && (q.type === 'scramble') && !cur.checked && /^[a-z]$/i.test(e.key)) { var t = Array.prototype.find.call(document.querySelectorAll('#bank .tile'), function (x) { return !x.disabled && x.textContent.toLowerCase() === e.key.toLowerCase(); }); if (t) t.click(); }
    else if (e.key === 'Backspace' && q && (q.type === 'scramble' || q.type === 'build') && !cur.checked && cur.picked.length) { var last = $('#tray .tile:last-child'); if (last) last.click(); }
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (st() && st().theme === 'auto') applyTheme(); });

  TY._debug = { get session() { return session; }, route: route };
  route();
})(window.TY = window.TY || {});

</script>
</body>
</html>
